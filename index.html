<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abrazzo Tuinkalender</title>
<style>
  :root{
    --olive:#4a5938; --olive-d:#3a4a2c; --terra:#b3623f; --terra-d:#8f4d31;
    --sand:#f3ede1; --sand-d:#e6dcc8; --ink:#2c2a24; --muted:#6f6a5d;
    --leaf:#6b8f4e; --gold:#c89a3c; --line:#d9d0bd; --card:#fbf8f1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--sand);color:var(--ink);line-height:1.5;padding-bottom:60px}
  header{background:var(--olive);color:var(--sand);padding:18px 16px 14px}
  header .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  header h1{font-size:1.35rem;font-weight:600;letter-spacing:.3px}
  header .sub{font-size:.82rem;opacity:.85;margin-top:2px}
  .lang{display:flex;gap:4px}
  .lang button{background:rgba(255,255,255,.12);color:var(--sand);border:1px solid rgba(255,255,255,.25);
    padding:5px 11px;border-radius:20px;font-size:.8rem;cursor:pointer;font-weight:600}
  .lang button.active{background:var(--terra);border-color:var(--terra)}
  nav{display:flex;gap:6px;overflow-x:auto;padding:12px 12px 4px;background:var(--olive-d);
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{white-space:nowrap;background:transparent;color:var(--sand);border:1px solid rgba(255,255,255,.22);
    padding:8px 14px;border-radius:20px;font-size:.85rem;cursor:pointer;font-weight:600;flex:0 0 auto}
  nav button.active{background:var(--sand);color:var(--olive-d);border-color:var(--sand)}
  main{max-width:760px;margin:0 auto;padding:16px 14px}
  .view{display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .now-banner{background:var(--terra);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:16px}
  .now-banner .label{font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;opacity:.9}
  .now-banner .big{font-size:1.5rem;font-weight:700;margin-top:1px}
  .now-banner .small{font-size:.85rem;opacity:.95;margin-top:3px}
  h2.section{font-size:1.05rem;color:var(--olive-d);margin:22px 0 10px;font-weight:700;
    border-bottom:2px solid var(--line);padding-bottom:6px}
  h2.section:first-child{margin-top:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:11px;
    box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .card.grass{border-left:5px solid var(--leaf)}
  .card.plant{border-left:5px solid var(--olive)}
  .card.mest{border-left:5px solid var(--gold)}
  .card.snoei{border-left:5px solid var(--terra)}
  .card.alert{border-left:5px solid #c0392b;background:#fdf2ef}
  .card.rust{border-left:5px solid #9aa0a6;background:#f5f4f0}
  .card .ttl{font-weight:700;font-size:.97rem;display:flex;align-items:center;gap:7px}
  .card .tag{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
    padding:2px 8px;border-radius:10px;color:#fff;flex:0 0 auto}
  .tag.grass{background:var(--leaf)} .tag.plant{background:var(--olive)}
  .tag.mest{background:var(--gold)} .tag.snoei{background:var(--terra)}
  .tag.alert{background:#c0392b} .tag.rust{background:#9aa0a6}
  .card .body{font-size:.88rem;margin-top:6px;color:var(--ink)}
  .card .meta{font-size:.78rem;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
  .card .meta span b{color:var(--olive-d)}
  .when{display:inline-block;font-size:.72rem;font-weight:700;background:var(--sand-d);color:var(--olive-d);
    padding:2px 9px;border-radius:10px;margin-top:7px}
  .month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
  .month-grid button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 4px;
    font-size:.85rem;font-weight:600;color:var(--ink);cursor:pointer;text-align:center}
  .month-grid button.cur{background:var(--olive);color:var(--sand);border-color:var(--olive)}
  .month-grid button.sel{outline:2px solid var(--terra);outline-offset:-2px}
  .season-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .season-row button{flex:1;min-width:70px;background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:9px 4px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink)}
  .season-row button.sel{background:var(--terra);color:#fff;border-color:var(--terra)}
  table{width:100%;border-collapse:collapse;font-size:.84rem;background:var(--card);border-radius:10px;overflow:hidden}
  th{background:var(--olive);color:var(--sand);text-align:left;padding:9px 10px;font-size:.78rem;font-weight:600}
  td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
  tr:nth-child(even) td{background:rgba(0,0,0,.015)}
  .pill{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:10px;
    background:var(--sand-d);color:var(--olive-d);white-space:nowrap}
  details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden}
  details summary{padding:12px 14px;font-weight:700;cursor:pointer;font-size:.92rem;list-style:none;
    display:flex;justify-content:space-between;align-items:center;gap:8px}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"+";font-size:1.3rem;color:var(--terra);font-weight:400}
  details[open] summary::after{content:"–"}
  details .dbody{padding:0 14px 14px;font-size:.86rem}
  details .dbody .row{margin-top:8px}
  details .dbody .row b{color:var(--olive-d);display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.4px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px;font-size:.74rem}
  .legend span{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .note{font-size:.82rem;color:var(--muted);font-style:italic;margin:8px 2px 0}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-style:italic}
  footer{text-align:center;font-size:.74rem;color:var(--muted);padding:20px 14px}
  @media(max-width:420px){header h1{font-size:1.15rem}.now-banner .big{font-size:1.25rem}}
  .small-note{font-size:.72rem;color:var(--muted);margin-top:2px;line-height:1.3}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
    color:var(--olive-d);margin-bottom:4px}
  .field select,.field input,.field textarea{width:100%;font-family:inherit;font-size:.9rem;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;-webkit-appearance:none;appearance:none}
  .field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236f6a5d' stroke-width='2' fill='none'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center}
  .field textarea{min-height:70px;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--olive);outline-offset:-1px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:420px){.row2{grid-template-columns:1fr}}
  .btn{background:var(--olive);color:var(--sand);border:none;border-radius:10px;padding:12px 18px;
    font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;width:100%}
  .btn:active{background:var(--olive-d)}
  .btn.sec{background:transparent;color:var(--olive-d);border:1px solid var(--line);font-weight:600}
  .btn.warn{background:var(--terra)}
  .btnrow{display:flex;gap:8px;margin-top:6px}
  .btnrow .btn{width:auto;flex:1}
  .calc{background:var(--sand-d);border-radius:9px;padding:10px 12px;font-size:.85rem;margin-top:-4px;margin-bottom:11px}
  .calc b{color:var(--olive-d)}
  .calc .hint{font-size:.76rem;color:var(--muted);margin-top:3px}
  .logitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--leaf);
    border-radius:10px;padding:11px 13px;margin-bottom:9px}
  .logitem .lh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .logitem .ld{font-size:.76rem;color:var(--muted);white-space:nowrap}
  .logitem .lw{font-weight:700;font-size:.94rem}
  .logitem .lz{font-size:.8rem;color:var(--olive-d);margin-top:2px}
  .logitem .lq{font-size:.82rem;margin-top:4px}
  .logitem .ln{font-size:.85rem;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--ink)}
  .logitem .lby{font-size:.72rem;color:var(--muted);margin-top:5px}
  .logitem.obs{border-left-color:var(--gold)}
  .logitem.pending{opacity:.75;border-style:dashed}
  .status{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted);margin-bottom:12px}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .dot.on{background:var(--leaf)} .dot.off{background:var(--gold)} .dot.err{background:#c0392b}
  .due{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .due .bar{width:5px;align-self:stretch;border-radius:3px;flex:0 0 auto}
  .due .dt{flex:1;min-width:0}
  .due .dn{font-weight:700;font-size:.88rem}
  .due .dd{font-size:.78rem;color:var(--muted);margin-top:1px}
  .due .dv{font-size:.78rem;font-weight:700;white-space:nowrap;padding:3px 9px;border-radius:10px}
  .ok{background:#e7f0e0;color:#40632a} .soon{background:#fbf0d8;color:#8a6a1c} .late{background:#fbe6e1;color:#a33a22}
  .never{background:var(--sand-d);color:var(--muted)}
  .taskdone{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
  .taskdone button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;
    font-size:.8rem;font-weight:600;font-family:inherit;color:var(--olive-d);cursor:pointer}
  .taskdone button.done{background:#e7f0e0;border-color:#a8c493;color:#40632a}
  .taskdone .dinfo{font-size:.76rem;color:var(--muted)}
  .dbody .pimg{display:block;width:100%;max-width:230px;height:auto;border-radius:8px;margin:2px 0 10px;border:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>Abrazzo Tuinkalender</h1>
      <div class="sub" data-i="subtitle">Wat te doen — per week, maand en seizoen</div>
    </div>
    <div class="lang">
      <button id="nl" class="active" onclick="setLang('nl')">NL</button>
      <button id="es" onclick="setLang('es')">ES</button>
    </div>
  </div>
</header>
<nav id="nav"></nav>
<main>
  <div id="v-nu" class="view active"></div>
  <div id="v-maand" class="view"></div>
  <div id="v-seizoen" class="view"></div>
  <div id="v-snoei" class="view"></div>
  <div id="v-problemen" class="view"></div>
  <div id="v-producten" class="view"></div>
  <div id="v-doseringen" class="view"></div>
  <div id="v-logboek" class="view"></div>
</main>
<footer>
  <span data-i="footer">Gebaseerd op het verzorgingsschema van Tuli · Abrazzo, Sant Andreu de Llavaneres</span>
</footer>

<script>
/* ============ DATA ============ */
const T = {
  nav:{nu:{nl:"Nu",es:"Ahora"},maand:{nl:"Per maand",es:"Por mes"},seizoen:{nl:"Per seizoen",es:"Por temporada"},
    snoei:{nl:"Snoei",es:"Poda"},problemen:{nl:"Plantproblemen",es:"Problemas"},producten:{nl:"Producten",es:"Productos"},doseringen:{nl:"Doseringen",es:"Dosis"},logboek:{nl:"Logboek",es:"Registro"}},
  subtitle:{nl:"Wat te doen — per week, maand en seizoen",es:"Qué hacer — por semana, mes y temporada"},
  footer:{nl:"Gebaseerd op het verzorgingsschema van Tuli · Abrazzo, Sant Andreu de Llavaneres",
    es:"Basado en el esquema de cuidado de Tuli · Abrazzo, Sant Andreu de Llavaneres"},
  thisMonth:{nl:"Deze maand",es:"Este mes"}, thisWeek:{nl:"Deze week",es:"Esta semana"},
  season:{nl:"Seizoen",es:"Temporada"}, nothing:{nl:"Geen vaste taken deze maand — rustperiode.",es:"Sin tareas fijas este mes — periodo de descanso."},
  weekHint:{nl:"Vroege ochtend of late avond bij hitte.",es:"Por la mañana temprano o por la tarde con calor."},
  pickMonth:{nl:"Kies een maand",es:"Elige un mes"}, pickSeason:{nl:"Kies een seizoen",es:"Elige una temporada"},
  legend:{nl:["Gras","Planten","Bemesting","Snoei","Let op","Rust"],es:["Césped","Plantas","Abono","Poda","Atención","Descanso"]}
};
const MONTHS={nl:["Januari","Februari","Maart","April","Mei","Juni","Juli","Augustus","September","Oktober","November","December"],
  es:["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"]};
const SEASONS={
  winter:{m:[11,0,1],nl:"Winter",es:"Invierno"},
  lente:{m:[2,3,4],nl:"Lente",es:"Primavera"},
  zomer:{m:[5,6,7],nl:"Zomer",es:"Verano"},
  herfst:{m:[8,9,10],nl:"Herfst",es:"Otoño"}};

/* reusable task blocks */
const grasCombo={cat:"grass",id:"gras_combo",vink:1,
  ttl:{nl:"Gras: Cystium N + Ficosturf + Ficosagro",es:"Césped: Cystium N + Ficosturf + Ficosagro"},
  body:{nl:"Samen in 1 rugzak. Cystium N = voeding, ondersteunt de groei. Ficosturf versterkt het gazon en maakt het groener, Ficosagro activeert het bodemleven.",
        es:"Juntos en una mochila. Cystium N = nutrición, estimula el crecimiento. Ficosturf fortalece y reverdece el césped, Ficosagro activa el suelo."},
  when:{nl:"Week 1 van de maand",es:"Semana 1 del mes"},
  meta:{nl:"Op de bodem · licht water vooraf, 1–2 u erna",es:"Sobre el suelo · riego ligero antes, 1–2 h después"}};
const plantCombo={cat:"plant",id:"plant_combo",vink:1,
  ttl:{nl:"Planten: Cystium N + Ficosagro",es:"Plantas: Cystium N + Ficosagro"},
  body:{nl:"Samen in 1 rugzak. Voor buitenplanten incl. citrus en struiken — Cystium N = voeding, ondersteunt bloei en groei. Vloeibare Fico-producten mogen samen gemengd worden.",
        es:"Juntos en una mochila. Plantas exteriores incl. cítricos y arbustos — Cystium N = nutrición, estimula flor y crecimiento. Los productos Fico líquidos se pueden mezclar."},
  when:{nl:"Week 1 van de maand",es:"Semana 1 del mes"},
  meta:{nl:"Op het blad · licht water vooraf, 1 u erna",es:"Sobre la hoja · riego ligero antes, 1 h después"}};
const purin={cat:"plant",id:"purin",vink:1,
  ttl:{nl:"Purín de Ortiga — schimmel + insect",es:"Purín de Ortiga — hongo + insecto"},
  body:{nl:"Gras én planten. Preventief tegen schimmel- en insectendruk. Versterkt de natuurlijke weerstand.",
        es:"Césped y plantas. Preventivo contra hongos e insectos. Refuerza la resistencia natural."},
  when:{nl:"Week 3 — 2 weken ná Ficos/Cystium",es:"Semana 3 — 2 semanas tras Ficos/Cystium"},
  meta:{nl:"Blad beide zijden · ⚠ nooit samen met Azufre",es:"Hoja por ambos lados · ⚠ nunca junto con Azufre"}};
const mest=(n)=>({cat:"mest",id:"mest_"+n,vink:1,
  ttl:{nl:"Organische bemesting ("+n+"/3)",es:"Abono orgánico ("+n+"/3)"},
  body:{nl:"Gras: Batlle césped (8-4-6). Planten/bomen: Batlle universal (6-4-6). Korrels licht door de aarde.",
        es:"Césped: Batlle césped (8-4-6). Plantas/árboles: Batlle universal (6-4-6). Bolitas ligeras en la tierra."},
  when:{nl:"1× deze maand — buiten de hitte",es:"1× este mes — fuera del calor"},
  meta:{nl:"Ideale temp 15–25°C · daarna water geven",es:"Temp ideal 15–25°C · regar después"}});

const CAL={
  0:{season:"winter",tasks:[
    {cat:"rust",ttl:{nl:"Rustperiode",es:"Periodo de descanso"},
     body:{nl:"Geen vaste behandelingen. Plan de snoei en controleer je materiaal en voorraad.",
           es:"Sin tratamientos fijos. Planifica la poda y revisa material y existencias."}}]},
  1:{season:"winter",tasks:[
    {cat:"snoei",ttl:{nl:"Snoei olijfboom",es:"Poda del olivo"},
     body:{nl:"Eind winter, ná de kans op vorst. Dode/zieke/kruisende takken + waterloten weg, kroon open houden.",
           es:"Fin de invierno, tras el frío. Quita ramas muertas/enfermas/cruzadas + chupones, copa abierta."},
     when:{nl:"Feb–maart",es:"Feb–marzo"},meta:{nl:"Max 25–30% van de kroon",es:"Máx 25–30% de la copa"}},
    {cat:"snoei",ttl:{nl:"Snoei sinaasappel & citroen",es:"Poda naranjo & limón"},
     body:{nl:"Lichte vormsnoei. Kruisende, zieke, dode takken + waterloten weg. Goede luchtcirculatie tegen schimmel.",
           es:"Poda ligera de forma. Ramas cruzadas/enfermas/muertas + chupones. Buena circulación de aire."},
     when:{nl:"Begin februari",es:"Principios de febrero"}},
    {cat:"alert",ttl:{nl:"Seizoen-start losse middelen",es:"Inicio de productos puntuales"},
     body:{nl:"Vanaf nu inzetbaar wanneer nódig: Ferrare (ijzer, t/m begin juni), Azufre (schimmel, t/m okt), Schneckenkorn (slakken, t/m nov). Alleen bij een concreet probleem.",
           es:"Desde ahora si hace falta: Ferrare (hierro, hasta inicio junio), Azufre (hongo, hasta oct), Schneckenkorn (caracoles, hasta nov). Solo ante un problema real."}}]},
  2:{season:"lente",tasks:[
    {cat:"alert",ttl:{nl:"Start groeiseizoen",es:"Inicio de la temporada"},
     body:{nl:"De maandcyclus begint. Vanaf nu t/m eind oktober elke maand de vaste behandelingen.",
           es:"Empieza el ciclo mensual. Desde ahora hasta fin de octubre, cada mes los tratamientos fijos."}},
    grasCombo, plantCombo, purin, mest(1),
    {cat:"snoei",ttl:{nl:"Olijf afronden + citrus",es:"Terminar olivo + cítricos"},
     body:{nl:"Laatste snoei olijfboom en citrus vóór de groei goed op gang komt.",
           es:"Última poda de olivo y cítricos antes de que arranque el crecimiento."}}]},
  3:{season:"lente",tasks:[grasCombo,plantCombo,purin,
    {cat:"snoei",ttl:{nl:"Snoei rozemarijn",es:"Poda romero"},
     body:{nl:"Na de bloei. Alleen jonge scheuten / 1/3 van de nieuwe groei. Nooit in oud hout — dat loopt slecht uit.",
           es:"Tras florecer. Solo brotes jóvenes / 1/3 del crecimiento nuevo. Nunca en madera vieja."},
     when:{nl:"Voorjaar",es:"Primavera"}}]},
  4:{season:"lente",tasks:[grasCombo,plantCombo,purin]},
  5:{season:"zomer",tasks:[grasCombo,plantCombo,purin,mest(2),
    {cat:"alert",ttl:{nl:"Ferrare loopt af",es:"Termina Ferrare"},
     body:{nl:"IJzer (Ferrare) alleen nog t/m begin juni. Daarna te warm — wacht tot september.",
           es:"Hierro (Ferrare) solo hasta inicio de junio. Después hace demasiado calor — espera a septiembre."}}]},
  6:{season:"zomer",tasks:[
    {cat:"alert",ttl:{nl:"Hitte — werk vroeg of laat",es:"Calor — trabaja temprano o tarde"},
     body:{nl:"Alle behandelingen in de vroege ochtend of late avond. GEEN organische bemesting (te heet).",
           es:"Todos los tratamientos por la mañana temprano o por la tarde. SIN abono orgánico (calor)."}},
    grasCombo,plantCombo,purin,
    {cat:"plant",ttl:{nl:"Cystium K — alleen bij stress",es:"Cystium K — solo con estrés"},
     body:{nl:"Cystium K = anti-stress. Bij extreme hitte, droogte of na snoei: herstel. Goed schudden. Ruim water vooraf en erna.",
           es:"Cystium K = anti-estrés. Con calor extremo, sequía o tras poda: recuperación. Agitar bien. Riego antes y después."},
     when:{nl:"Indien nodig",es:"Si es necesario"}}]},
  7:{season:"zomer",tasks:[
    {cat:"alert",ttl:{nl:"Hitte — werk vroeg of laat",es:"Calor — trabaja temprano o tarde"},
     body:{nl:"Behandelingen vroege ochtend / late avond. Geen bemesting. Cystium K bij hittestress.",
           es:"Tratamientos temprano / tarde. Sin abono. Cystium K con estrés por calor."}},
    grasCombo,plantCombo,purin,
    {cat:"snoei",ttl:{nl:"Oleander — na de bloei",es:"Adelfa — tras florecer"},
     body:{nl:"Eind zomer, direct na de bloei. Jaarlijks ~1/3 van de oudste takken laag bij de basis weg.",
           es:"Fin de verano, tras florecer. Cada año ~1/3 de las ramas más viejas desde la base."},
     when:{nl:"Eind zomer",es:"Fin de verano"}}]},
  8:{season:"herfst",tasks:[grasCombo,plantCombo,purin,mest(3),

  {n:"Ficosturf",dose:{nl:"40 ml per rugzak (2,5 ml/L) — gras boven 4 rugzakken = 160 ml, zwembad 2 rugzakken = 80 ml.",es:"40 ml por mochila (2,5 ml/L) — césped arriba 4 mochilas = 160 ml, piscina 2 mochilas = 80 ml."},voor:{nl:"Gras",es:"Césped"},per:{nl:"Maart–eind oktober",es:"Marzo–fin octubre"},freq:{nl:"1× per maand",es:"1× al mes"},
   d:{nl:"Met Ficosagro in 1 rugzak. Versterkt het gazon en maakt het groener. Op de bodem, licht water vooraf en 1–2 u erna. Dosering is per oppervlak: meer rugzakken betekent meer water, niet meer product.",es:"Con Ficosagro en una mochila. Fortalece y reverdece el césped. Sobre suelo, riego ligero antes y 1–2 h después. La dosis es por superficie: más mochilas significa más agua, no más producto."}},
  {n:"Ficosagro",dose:{nl:"Gras: 200 ml per rugzak (12,5 ml/L) — boven 4 rugzakken = 800 ml, zwembad 2 rugzakken = 400 ml. Losse planten en nieuwe aanplant: etiketsterkte 250 ml op 3 L water, gericht aan de wortel.",es:"Césped: 200 ml por mochila (12,5 ml/L) — arriba 4 mochilas = 800 ml, piscina 2 mochilas = 400 ml. Plantas sueltas y plantación nueva: dosis de etiqueta 250 ml en 3 L de agua, a la raíz."},voor:{nl:"Gras + planten",es:"Césped + plantas"},per:{nl:"Maart–eind oktober",es:"Marzo–fin octubre"},freq:{nl:"1× per maand",es:"1× al mes"},bewaar:{nl:"Na openen binnen 3 maanden opmaken",es:"Una vez abierto, consumir en 3 meses"},
   d:{nl:"Activeert het bodemleven. Combineer met Ficosturf (gras) of Cystium N (planten). Etiket: 1× per maand, vooral ná zaaien of verplanten, en het effect is sterker wanneer je het ná de bemesting geeft — dus in maart, juni en september eerst de Batlle-korrels, daarna pas Ficosagro. Overdosering schaadt de plant niet.",es:"Activa el suelo. Combina con Ficosturf (césped) o Cystium N (plantas). Etiqueta: 1× al mes, sobre todo tras la siembra o el trasplante, y el efecto es mayor aplicado tras el abonado — en marzo, junio y septiembre primero las bolitas Batlle, después Ficosagro. La sobredosis no daña la planta."}},
  {n:"Cystium N",dose:{nl:"Gras: 20 ml per rugzak (1,25 ml/L) — boven 4 rugzakken = 80 ml, zwembad 2 rugzakken = 40 ml. Planten: 40 ml per rugzak.",es:"Césped: 20 ml por mochila (1,25 ml/L) — arriba 4 mochilas = 80 ml, piscina 2 mochilas = 40 ml. Plantas: 40 ml por mochila."},voor:{nl:"Gras + buitenplanten, citrus, struiken",es:"Césped + plantas, cítricos, arbustos"},per:{nl:"Maart–eind oktober",es:"Marzo–fin octubre"},freq:{nl:"1× per maand",es:"1× al mes"},
   d:{nl:"N = voeding. Bij gras samen met Ficosturf + Ficosagro; bij planten met Ficosagro in 1 rugzak. Ondersteunt bloei en groei. Let op: stikstof — bij gras niet ruimer doseren dan hierboven, zeker niet in de zomer.",es:"N = nutrición. En césped con Ficosturf + Ficosagro; en plantas con Ficosagro en una mochila. Estimula flor y crecimiento. Atención: es nitrógeno — en césped no superar la dosis indicada, menos aún en verano."}},
  {n:"Cystium K",dose:{nl:"Gras boven 45 ml/rugzak (4× = 180 ml); gras zwembad 35 ml/rugzak (2× = 69 ml); planten 30 ml. Bij zware stress naar 55 resp. 40 ml — dat is de fiche-max.",es:"Césped arriba 45 ml/mochila (4× = 180 ml); césped piscina 35 ml/mochila (2× = 69 ml); plantas 30 ml. Con estrés fuerte 55 resp. 40 ml — es el máximo de la ficha."},voor:{nl:"Gras + planten",es:"Césped + plantas"},per:{nl:"Groeiseizoen; extra bij stress",es:"Temporada de crecimiento; extra con estrés"},freq:{nl:"Afhankelijk van situatie",es:"Según situación"},bewaar:{nl:"Ongeopend 2 jaar · na openen binnen 9 maanden opmaken",es:"Cerrado 2 años · abierto, consumir en 9 meses"},
   d:{nl:"Bioestimulant uit zeewier (Macrocystis pyrifera), werkt via fytohormonen. Etiketdosis: 2–3 L per hectare per toepassing. Omgerekend naar Abrazzo is dat 45 ml per rugzak boven en 35 ml beneden; bij zware stress 55 resp. 40 ml, en niet hoger — het etiket kent geen superstress-dosis. Goed schudden vóór gebruik, ruim water vooraf en erna. Let op: dit is géén kaliumbemesting (N 0,1% · P 0,0% · K 1,3%) — een kaliumtekort in de bodem los je hier niet mee op. Naast stressherstel ook goed voor wortelbeharing, bladmassa en fotosynthese, dus breder inzetbaar dan alleen als noodmiddel.",es:"Bioestimulante de alga (Macrocystis pyrifera), actúa por fitohormonas. Dosis de etiqueta: 2–3 L por hectárea y aplicación. En Abrazzo son 45 ml por mochila arriba y 35 ml abajo; con estrés fuerte 55 resp. 40 ml, no más — la etiqueta no contempla dosis de súper estrés. Agitar bien antes, riego abundante antes y después. Atención: no es un abono de potasio (N 0,1% · P 0,0% · K 1,3%) — no corrige una carencia de potasio en el suelo. Además de recuperar del estrés, favorece la pilosidad radicular, la masa foliar y la fotosíntesis, así que es más versátil que un simple remedio de emergencia."}},

  {n:"HydraGuard",dose:{nl:"80 ml per rugzak (0,5%) — gras boven 4 rugzakken = 320 ml, zwembad 2 rugzakken = 160 ml. Volledige ronde 480 ml.",es:"80 ml por mochila (0,5%) — césped arriba 4 mochilas = 320 ml, piscina 2 mochilas = 160 ml. Ronda completa 480 ml."},voor:{nl:"Gras",es:"Césped"},per:{nl:"Droge periode / zomer",es:"Periodo seco / verano"},freq:{nl:"Nog vast te leggen",es:"Aún por definir"},
   d:{nl:"Houdt vocht vast in de wortelzone en gaat tegen dat de bodem waterafstotend wordt — in Llavaneres speelt dat in de zomer. Water geven vóór én ná het sproeien: vooraf zodat het product niet op een kurkdroge toplaag blijft liggen, erna om het de wortelzone in te spoelen. Zonder nabewateren werkt het niet.",es:"Retiene la humedad en la zona radicular y evita que el suelo se vuelva hidrófobo — en Llavaneres pasa en verano. Regar antes y después de pulverizar: antes para que el producto no se quede en una capa reseca, después para llevarlo a la zona de raíces. Sin riego posterior no funciona."}},

/* dosering uitrekenen voor product + zone */
function berekenDosis(product,zoneId){
  const z=zoneById(zoneId), it=watById(product);
  if(!it||!it.calc)return null;
  const namen=it.combi||[product];
  const regels=[];
  namen.forEach(n=>{
    const d=DOSISTABEL.find(x=>x.n==n); if(!d)return;
    let ml=null;
    if(z.type=="gras") ml = (z.id=="gras_boven")?d.boven:d.beneden;
    else ml = d.plant;
    if(ml==null){regels.push({n:n,ml:null});return}
    regels.push({n:n,ml:ml,tot:ml*z.rz});
  });
  return {zone:z,rz:z.rz,liter:z.rz*16,regels:regels};
}
function dosisTekst(product,zoneId){
  const c=berekenDosis(product,zoneId); if(!c)return "";
  return c.regels.filter(r=>r.ml!=null).map(r=>r.n+" "+r.tot+" ml").join(" + ")+" ("+c.rz+"×16 L)";
}

const LSKEY="abrazzo_tuin_log_v2", LSWIE="abrazzo_tuin_wie";
let LOG=[], REMOTE=[], syncState={mode:"local",msg:""};
function loadLog(){try{LOG=JSON.parse(localStorage.getItem(LSKEY)||"[]")}catch(e){LOG=[]}}

/* alle regels, eigen + gedeeld, ontdubbeld op id */
function alleRegels(){
  const map=new Map();
  REMOTE.forEach(r=>map.set(r.id,r));
  LOG.forEach(r=>map.set(r.id,Object.assign({},map.get(r.id)||{},r)));
  return Array.from(map.values()).sort((a,b)=>(b.datum+b.id).localeCompare(a.datum+a.id));
}

/* ---------- synchronisatie ---------- */
/* Vul deze twee in zodra de Google Sheet en het formulier klaarstaan.
   Zonder deze waarden werkt de app volledig, maar blijft alles op dit apparaat. */
const SYNC={
  apiUrl:"https://script.google.com/macros/s/AKfycbzh3CWpvxeh6gfIez3nsVGEj0Hj2rVCfLersZUu8002Xd9JeGw2sV79ThX9ELEguMn2/exec"   /* Apps Script web-app URL, eindigt op /exec */
};
function syncAan(){return !!SYNC.apiUrl}

function haalRemote(){
  if(!SYNC.apiUrl){syncState={mode:"local",msg:""};return Promise.resolve()}
  return fetch(SYNC.apiUrl+"?actie=lijst&t="+Date.now(),{cache:"no-store"})
    .then(r=>r.json()).then(d=>{
      if(!d||!d.regels)throw new Error("onverwacht antwoord");
      REMOTE=d.regels.filter(r=>r&&r.datum).map(r=>({
        id:String(r.id||""),datum:String(r.datum||"").slice(0,10),zone:String(r.zone||""),
        wat:String(r.wat||""),hoeveel:String(r.hoeveel||""),wie:String(r.wie||""),
        notitie:String(r.notitie||""),taak:String(r.taak||""),synced:1}));
      const ids=new Set(REMOTE.map(r=>r.id));
      let ch=false;LOG.forEach(r=>{if(!r.synced&&ids.has(r.id)){r.synced=1;ch=true}});
      if(ch)saveLog();
      /* opgeruimd: eigen regels die bevestigd op de sheet staan hoeven niet dubbel lokaal */
      syncState={mode:"online",msg:""};
    }).catch(e=>{syncState={mode:"offline",msg:String(e.message||e)}});
}
function stuurPending(){
  if(!SYNC.apiUrl)return Promise.resolve();
  const pend=LOG.filter(r=>!r.synced);
  if(!pend.length)return Promise.resolve();
  return Promise.all(pend.map(r=>{
    const fd=new URLSearchParams();
    fd.append("actie","toevoegen");
    ["id","datum","zone","wat","hoeveel","wie","notitie","taak"].forEach(k=>fd.append(k,r[k]||""));
    return fetch(SYNC.apiUrl,{method:"POST",mode:"no-cors",body:fd})
      .then(()=>{r.verzonden=1}).catch(()=>{});
  })).then(()=>saveLog());
}
function syncNu(){
  if(!syncAan()){renderLogboek();return}
  syncState={mode:"bezig",msg:""};renderLogboek();
  stuurPending().then(haalRemote).then(()=>{renderLogboek();renderNu()});
}

/* ---------- toevoegen ---------- */
function logToevoegen(rec){
  rec.id=rec.id||uid();
  LOG.push(rec);saveLog();
  if(syncAan())stuurPending().then(()=>{});
}
function logVerwijderen(id){
  const r=LOG.find(x=>x.id==id);
  if(!r)return;
  if(!confirm(L({nl:"Deze regel verwijderen? Als hij al gedeeld is, blijft hij bij de anderen staan tot je hem ook in de Sheet weghaalt.",es:"¿Borrar esta línea? Si ya se compartió, seguirá visible para los demás hasta que la borres también en la hoja."})))return;
  LOG=LOG.filter(x=>x.id!=id);saveLog();renderLogboek();renderNu();
}

/* ---------- taken afvinken ---------- */
function taakKey(t){return t.id||("t_"+L(t.ttl).toLowerCase().replace(/[^a-z0-9]+/g,"_").slice(0,28))}
function taakGedaan(t,maand,jaar){
  const k=taakKey(t), pre=(jaar||new Date().getFullYear())+"-"+String((maand==null?curM:maand)+1).padStart(2,"0");
  return alleRegels().find(r=>r.taak==k&&(r.datum||"").startsWith(pre));
}
function taakAfvinken(key,maand){
  const jaar=new Date().getFullYear();
  const t=(CAL[maand]&&CAL[maand].tasks||[]).find(x=>taakKey(x)==key);
  const titel=t?L(t.ttl):key;
  const best=alleRegels().find(r=>r.taak==key&&(r.datum||"").startsWith(jaar+"-"+String(maand+1).padStart(2,"0")));
  if(best){
    if(!LOG.find(x=>x.id==best.id)){alert(L({nl:"Deze is door iemand anders afgevinkt — haal hem weg in het logboek of in de Sheet.",es:"Otra persona lo marcó — quítalo en el registro o en la hoja."}));return}
    LOG=LOG.filter(x=>x.id!=best.id);saveLog();
  }else{
    logToevoegen({id:uid(),datum:today(),zone:"",wat:titel,hoeveel:"",wie:getWie(),notitie:"",taak:key});
  }
  renderNu();renderMaand();renderLogboek();
}

/* ============ LOGBOEK: WEERGAVE ============ */
const LT={
  titel:{nl:"Logboek",es:"Registro"},
  nieuw:{nl:"Noteren",es:"Anotar"},
  datum:{nl:"Datum",es:"Fecha"},
  zone:{nl:"Waar",es:"Dónde"},
  wat:{nl:"Wat",es:"Qué"},
  hoeveel:{nl:"Hoeveelheid",es:"Cantidad"},
  wie:{nl:"Wie",es:"Quién"},
  notitie:{nl:"Notitie",es:"Nota"},
  opslaan:{nl:"Opslaan",es:"Guardar"},
  kies:{nl:"— kies —",es:"— elige —"},
  geschiedenis:{nl:"Wat er gedaan is",es:"Lo que se ha hecho"},
  leeg:{nl:"Nog niets genoteerd. Vul hierboven het formulier in — het eerste wat je noteert verschijnt hier.",es:"Aún no hay nada. Rellena el formulario de arriba — lo primero que anotes aparecerá aquí."},
  alles:{nl:"Alle zones",es:"Todas las zonas"},
  filter:{nl:"Filter",es:"Filtro"},
  verwijder:{nl:"verwijderen",es:"borrar"},
  lokaal:{nl:"Alleen op dit apparaat — delen staat nog niet aan",es:"Solo en este dispositivo — compartir aún no está activo"},
  online:{nl:"Gedeeld met Jenny en Tuli",es:"Compartido con Jenny y Tuli"},
  offline:{nl:"Geen verbinding — opgeslagen op dit apparaat, gaat vanzelf mee zodra je weer online bent",es:"Sin conexión — guardado en el dispositivo, se enviará al recuperar la red"},
  bezig:{nl:"Bezig met bijwerken…",es:"Actualizando…"},
  ververs:{nl:"Bijwerken",es:"Actualizar"},
  nietverzonden:{nl:"wacht op verzending",es:"pendiente de enviar"},
  status:{nl:"Stand van zaken",es:"Estado"},
  nooit:{nl:"nog niet genoteerd",es:"aún sin anotar"},
  dgn:{nl:"dagen geleden",es:"días"},
  vandaag:{nl:"vandaag",es:"hoy"},
  gisteren:{nl:"gisteren",es:"ayer"},
  gedaan:{nl:"Gedaan",es:"Hecho"},
  afvinken:{nl:"Afvinken",es:"Marcar"},
  op:{nl:"op",es:"el"}
};
let logFilter="";

function dagenGeleden(datum){
  if(!datum)return null;
  const d=new Date(datum+"T12:00:00"), n=new Date();
  return Math.floor((n-d)/86400000);
}
function dagTekst(n){
  if(n==null)return L(LT.nooit);
  if(n<=0)return L(LT.vandaag);
  if(n==1)return L(LT.gisteren);
  return n+" "+L(LT.dgn);
}

function renderLogboek(){
  const wie=getWie();
  let h=`<h2 class="section">${L(LT.nieuw)}</h2>`;

  /* status */
  let cls="off",txt=L(LT.lokaal);
  if(syncState.mode=="online"){cls="on";txt=L(LT.online)}
  else if(syncState.mode=="offline"){cls="err";txt=L(LT.offline)}
  else if(syncState.mode=="bezig"){cls="off";txt=L(LT.bezig)}
  h+=`<div class="status"><span class="dot ${cls}"></span><span>${txt}</span>`;
  if(syncAan())h+=`<button class="btn sec" style="width:auto;padding:4px 10px;font-size:.75rem;margin-left:auto" onclick="syncNu()">${L(LT.ververs)}</button>`;
  h+=`</div>`;

  /* formulier */
  h+=`<div class="card">`;
  h+=`<div class="row2">
    <div class="field"><label>${L(LT.datum)}</label><input type="date" id="f-datum" value="${today()}"></div>
    <div class="field"><label>${L(LT.wie)}</label><select id="f-wie">
      <option value="">${L(LT.kies)}</option>
      ${["KJ","Jenny","Tuli"].map(w=>`<option value="${w}"${w==wie?" selected":""}>${w}</option>`).join("")}
    </select></div></div>`;
  h+=`<div class="field"><label>${L(LT.zone)}</label><select id="f-zone" onchange="updateCalc()">
    ${ZONES.map(z=>`<option value="${z.id}">${L(z)}${z.m2?" · "+z.m2+" m²":""}</option>`).join("")}
  </select></div>`;
  h+=`<div class="field"><label>${L(LT.wat)}</label><select id="f-wat" onchange="updateCalc()">
    <option value="">${L(LT.kies)}</option>
    ${LOGWAT.map(g=>`<optgroup label="${L(g.g)}">${g.items.map(i=>`<option value="${i.v}">${L(i)}</option>`).join("")}</optgroup>`).join("")}
  </select></div>`;
  h+=`<div id="f-calc"></div>`;
  h+=`<div class="field"><label>${L(LT.hoeveel)}</label><input type="text" id="f-hoeveel" placeholder="${L({nl:"wordt ingevuld zodra je zone en product kiest",es:"se rellena al elegir zona y producto"})}"></div>`;
  h+=`<div class="field"><label>${L(LT.notitie)}</label><textarea id="f-notitie" placeholder="${L({nl:"Wat viel op? Bijvoorbeeld: gele plek bij de hoek, bodem erg droog, wind uit zee.",es:"¿Qué observaste? Por ejemplo: mancha amarilla en la esquina, suelo muy seco, viento del mar."})}"></textarea></div>`;
  h+=`<button class="btn" onclick="opslaanLog()">${L(LT.opslaan)}</button>`;
  h+=`<div id="f-status-ok" style="display:none;margin-top:9px;font-size:.84rem;color:#40632a;background:#e7f0e0;border-radius:8px;padding:8px 11px">${L({nl:"Genoteerd.",es:"Anotado."})}</div>`;
  h+=`</div>`;

  /* geschiedenis */
  const regels=alleRegels().filter(r=>!logFilter||r.zone==logFilter);
  h+=`<h2 class="section">${L(LT.geschiedenis)}</h2>`;
  h+=`<div class="field"><label>${L(LT.filter)}</label><select onchange="logFilter=this.value;renderLogboek()">
    <option value="">${L(LT.alles)}</option>
    ${ZONES.map(z=>`<option value="${z.id}"${z.id==logFilter?" selected":""}>${L(z)}</option>`).join("")}
  </select></div>`;
  if(!regels.length){h+=`<div class="empty">${L(LT.leeg)}</div>`}
  else{
    regels.slice(0,200).forEach(r=>{
      const eigen=LOG.some(x=>x.id==r.id), pend=eigen&&!r.synced&&syncAan();
      const it=watById(r.wat), obs=it&&it.obs;
      const z=r.zone?zoneById(r.zone):null;
      h+=`<div class="logitem ${obs?"obs":""} ${pend?"pending":""}">
        <div class="lh"><div class="lw">${it?L(it):(r.wat||L(LT.notitie))}</div><div class="ld">${r.datum}</div></div>
        ${z?`<div class="lz">${L(z)}</div>`:""}
        ${r.hoeveel?`<div class="lq">${r.hoeveel}</div>`:""}
        ${r.notitie?`<div class="ln">${r.notitie.replace(/</g,"&lt;")}</div>`:""}
        <div class="lby">${r.wie?r.wie:"—"}${pend?" · "+L(LT.nietverzonden):""}${eigen?` · <a href="#" onclick="event.preventDefault();logVerwijderen('${r.id}')">${L(LT.verwijder)}</a>`:""}</div>
      </div>`;
    });
  }
  document.getElementById("v-logboek").innerHTML=h;
  updateCalc();
}

function updateCalc(){
  const ws=document.getElementById("f-wat"), zs=document.getElementById("f-zone"), box=document.getElementById("f-calc");
  if(!ws||!zs||!box)return;
  const c=berekenDosis(ws.value,zs.value);
  if(!c){box.innerHTML="";return}
  const geldig=c.regels.filter(r=>r.ml!=null);
  if(!geldig.length){
    box.innerHTML=`<div class="calc">${L({nl:"Voor deze zone staat geen dosering vast — vul zelf in wat je gebruikt hebt.",es:"No hay dosis fijada para esta zona — indica tú mismo lo que has usado."})}</div>`;
    return;
  }
  let h=`<div class="calc"><b>${c.rz} ${L({nl:"rugzakken",es:"mochilas"})} · ${c.liter} L</b><br>`;
  h+=geldig.map(r=>`${r.n}: <b>${r.ml} ml</b> ${L({nl:"per rugzak",es:"por mochila"})} → <b>${r.tot} ml</b> ${L({nl:"totaal",es:"total"})}`).join("<br>");
  if(ws.value=="HydraGuard")h+=`<div class="hint">${L({nl:"Water geven vóór én ná het sproeien — anders bereikt het de wortelzone niet.",es:"Regar antes y después de pulverizar — si no, no llega a la zona radicular."})}</div>`;
  if(ws.value=="Cystium K")h+=`<div class="hint">${L({nl:"Bij zware stress: boven 55 ml, zwembad 40 ml per rugzak. Niet hoger — dat is de fiche-max.",es:"Con estrés fuerte: arriba 55 ml, piscina 40 ml por mochila. No más — es el máximo de la ficha."})}</div>`;
  if(ws.value=="Ficosagro")h+=`<div class="hint">${L({nl:"Ná de bemesting toepassen versterkt het effect.",es:"Aplicar tras el abonado refuerza el efecto."})}</div>`;
  h+=`</div>`;
  box.innerHTML=h;
  const hv=document.getElementById("f-hoeveel");
  if(hv&&!hv.dataset.touched)hv.value=geldig.map(r=>r.n+" "+r.tot+" ml").join(" + ");
}

function opslaanLog(){
  const g=id=>document.getElementById(id);
  const wat=g("f-wat").value;
  if(!wat){alert(L({nl:"Kies eerst wat je gedaan hebt.",es:"Elige primero qué has hecho."}));return}
  const wie=g("f-wie").value;
  if(wie)setWie(wie);
  logToevoegen({id:uid(),datum:g("f-datum").value||today(),zone:g("f-zone").value,wat:wat,
    hoeveel:g("f-hoeveel").value.trim(),wie:wie,notitie:g("f-notitie").value.trim(),taak:""});
  const zb=g("f-zone").value;
  renderLogboek();renderNu();
  const z2=document.getElementById("f-zone"); if(z2)z2.value=zb;
  updateCalc();
  const s=document.getElementById("f-status-ok");
  if(s){s.style.display="block";setTimeout(()=>{const x=document.getElementById("f-status-ok");if(x)x.style.display="none"},2600)}
  window.scrollTo(0,0);
}

/* ============ ACHTERSTAND IN NU ============ */
const VASTE=[
  {key:"gras_combo",  nl:"Gras: Cystium N + Ficosturf + Ficosagro", es:"Césped: Cystium N + Ficosturf + Ficosagro", dagen:30, watm:["Combi gras","Ficosturf","Ficosagro","Cystium N"]},
  {key:"plant_combo", nl:"Planten: Cystium N + Ficosagro",          es:"Plantas: Cystium N + Ficosagro",           dagen:30, watm:["Combi planten"]},
  {key:"purin",       nl:"Purín de Ortiga",                          es:"Purín de Ortiga",                          dagen:30, watm:["Purín de Ortiga"]}
];
function laatsteVan(v){
  const rs=alleRegels().filter(r=>r.taak==v.key||v.watm.indexOf(r.wat)>=0);
  if(!rs.length)return null;
  return rs.map(r=>r.datum).sort().reverse()[0];
}
function achterstandHTML(){
  if(curM<2||curM>9)return "";
  let h=`<h2 class="section">${L(LT.status)}</h2>`;
  VASTE.forEach(v=>{
    const d=laatsteVan(v), n=dagenGeleden(d);
    let cl="never",bar="#9aa0a6";
    if(n!=null){
      if(n<v.dagen-5){cl="ok";bar="var(--leaf)"}
      else if(n<=v.dagen+10){cl="soon";bar="var(--gold)"}
      else {cl="late";bar="var(--terra)"}
    }
    h+=`<div class="due"><div class="bar" style="background:${bar}"></div>
      <div class="dt"><div class="dn">${L(v)}</div>
      <div class="dd">${d?L(LT.op)+" "+d:L({nl:"nog geen enkele keer genoteerd",es:"nunca anotado"})}</div></div>
      <div class="dv ${cl}">${dagTekst(n)}</div></div>`;
  });
  h+=`<p class="note">${L({nl:"Gebaseerd op het logboek. Vink een taak hieronder af of noteer hem, dan telt de teller opnieuw.",es:"Según el registro. Marca una tarea abajo o anótala, y el contador vuelve a empezar."})}</p>`;
  return h;
}

function renderAll(){buildNav();renderNu();renderMaand();renderSeizoen();renderSnoei();renderProblemen();renderProducten();renderDoseringen();renderLogboek();
  document.querySelectorAll("[data-i]").forEach(e=>{const k=e.getAttribute("data-i");if(T[k])e.textContent=L(T[k])})}

loadLog();
renderAll();showTab(curTab);
if(syncAan()){syncNu();window.addEventListener("online",syncNu)}
document.addEventListener("input",e=>{if(e.target&&e.target.id=="f-hoeveel")e.target.dataset.touched="1"});
</script>
